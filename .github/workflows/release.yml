name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Test
        run: swift test

      - name: Build
        run: ./scripts/build-app.sh

      - name: Package
        run: ./scripts/package-release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/Burrow.zip dist/Burrow.dmg dist/SHA256SUMS
